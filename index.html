<head>

  <title>Samad Permis C — Préparation à l'examen</title>
  <style>
    html, body { margin: 0; padding: 0; background: #22262B; }
    #root {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #F4F1EA; font-family: sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
    }
    #boot-error {
      display: none; max-width: 480px; background: #F4F1EA; color: #1A1D21; border-radius: 12px;
      padding: 20px; text-align: left; font-family: sans-serif; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="root">Chargement de l'application… (connexion internet nécessaire)</div>
  <div id="boot-error"></div>

  <script>
    // Filet de sécurité : si quelque chose empêche l'application de démarrer,
    // on affiche un message clair au lieu d'une page blanche silencieuse.
    window.addEventListener("error", function (e) {
      var box = document.getElementById("boot-error");
      var root = document.getElementById("root");
      if (box && !window.__appMounted) {
        root.style.display = "none";
        box.style.display = "block";
        box.innerHTML =
          "<strong>L'application n'a pas pu démarrer.</strong><br><br>" +
          "Cause probable : la connexion internet a été coupée pendant le chargement, " +
          "ou une extension/un pare-feu bloque les fichiers nécessaires (React, Babel).<br><br>" +
          "Détail technique : " + (e.message || "erreur inconnue");
      }
    });
  </script>

    { q: "Si, dans la même journée, vous conduisez un véhicule avec un chronotachygraphe à disque après avoir conduit un véhicule avec un chronotachygraphe numérique, devez-vous utiliser un disque vierge ?", a: "Oui", e: "Quand je passe d'un véhicule à chronotachygraphe numérique à un véhicule à disque, je dois utiliser un disque vierge." },
    { q: "Le châssis d'un véhicule lourd est principalement constitué de longerons et de … ?", a: "Traverses", e: "Le châssis d'un camion est principalement constitué de longerons et de traverses, comme une échelle." },
    { q: "Quel est le document, lié à l'entreprise, qui doit se trouver dans un camion de plus de 6 t de PMA et de plus de 3,5 t de charge utile, qui effectue un transport de marchandises pour compte d'autrui ?", a: "Copie conforme de la licence communautaire", e: "C'est la copie conforme de la licence communautaire qui doit se trouver dans le véhicule ; l'original reste au sein de l'entreprise." },
    { q: "Quelle est la charge utile d'un véhicule dont le PTAC est de 19 t et le poids à vide de 7 t ?", a: "12 t", e: "Formule pour trouver la charge utile : PTAC − poids à vide." },
    { q: "Votre véhicule (isolé) a un PTAC de 16 t. Sur route prioritaire à double sens, quelle est la vitesse maximale autorisée ?", a: "80 km/h", e: "Sur les routes, qu'elles soient prioritaires ou non, les camions isolés sont limités à 80 km/h." },
    { q: "Un conducteur effectuant un transport de matières dangereuses dans un véhicule fourgon doit-il obligatoirement avoir suivi une formation particulière ?", a: "Oui", e: "Un conducteur transportant des matières dangereuses doit avoir suivi une formation spécifique adaptée au transport effectué." },
    { q: "Vous avez interrompu votre conduite pendant 1 h 15 mn. Ce temps peut-il être pris en compte pour le calcul du temps de repos journalier ?", a: "Non", e: "Le repos journalier est de 11 heures consécutives. Il peut être fractionné en deux périodes : une première d'au moins 3 heures, puis une seconde de 9 heures. Une interruption d'1h15 ne peut donc pas compter comme premier repos." },
    { q: "Dans un camion neuf, le conducteur doit-il obligatoirement attacher sa ceinture de sécurité ?", a: "Oui", e: "Dans un camion neuf, le conducteur doit obligatoirement attacher sa ceinture de sécurité dès lors que le siège en est équipé." },
  ]},
  { n: 2, items: [
    { q: "Quand je circule en Espagne, quel numéro de téléphone est-il conseillé d'utiliser pour appeler les secours à partir d'un portable ?", a: "112", e: "Le 112 est le numéro d'urgence européen, à utiliser pour joindre les secours, notamment depuis un téléphone portable." },
    { q: "Débrancher ou modifier les réglages du limiteur de vitesse peut entraîner une suspension du permis de conduire, même s'il n'y a pas eu d'excès de vitesse constaté. Vrai ou Faux ?", a: "Vrai", e: "Débrancher ou modifier le limiteur de vitesse est interdit et peut entraîner une suspension du permis, même si aucun excès de vitesse n'a été constaté." },
    { q: "Après 3 h de conduite continue, s'arrêter 10 mn sur un parking est-il considéré comme une pause ?", a: "Non", e: "Après 4h30 de conduite, une pause de 45 minutes est obligatoire. Elle peut être fractionnée en deux périodes, une de 15 minutes puis une de 30 minutes. Un arrêt de 10 minutes ne suffit pas : la première partie de la pause doit être d'au moins 15 minutes." },

    { q: "La licence de transport intérieur permet d'effectuer des transports de tout tonnage à condition de rester en France. Vrai ou faux ?", a: "Faux", e: "La licence de transport intérieur permet de transporter des marchandises en France avec des véhicules jusqu'à 3,5 tonnes maximum." },
    { q: "Vous chargez du sable dans un véhicule isolé, quelle est la charge maximale autorisée sur l'essieu le plus chargé du groupe d'essieux moteur ?", a: "11,5 t (11 t 500)", e: "Pour un véhicule isolé, la charge maximale autorisée sur l'essieu le plus chargé du groupe d'essieux moteurs est de 11,5 tonnes ; ne pas confondre avec l'essieu isolé, limité à 13 tonnes." },
    { q: "Vous conduisez un camion neuf de 19 t de PTAC. À quelle vitesse êtes-vous limité en agglomération, sur une portion de route relevée à 70 km/h ?", a: "50 km/h", e: "Même si la vitesse relevée est de 70 km/h, les véhicules de transport de marchandises de plus de 3,5 tonnes restent limités à 50 km/h en agglomération." },
    { q: "Certains éléments de la chaîne cinématique nécessitent d'être vidangés ou … ?", a: "Graissés", e: "Certains éléments de la chaîne cinématique doivent être vidangés ou graissés pour assurer leur bon fonctionnement et éviter leur usure." },
    { q: "Vous attendez votre tour pour décharger sans connaître le temps d'attente. Sur quel symbole devez-vous positionner le sélecteur d'activité du chronotachygraphe ?", a: "Autres tâches (marteaux)", e: "Une attente dont la durée est inconnue à l'avance doit être classée en « autre tâche »." },
    { q: "Une pierre coincée entre des roues jumelées peut entraîner l'éclatement d'un pneumatique. Vrai ou Faux ?", a: "Vrai", e: "Une pierre coincée entre les roues jumelées peut provoquer une forte pression sur le pneu et entraîner son éclatement." },
  ]},
  { n: 3, items: [
    { q: "Citez un type d'extincteur couramment utilisé pour éteindre une voiture en flamme.", a: "Poudre, mousse ou CO2", e: "Ces trois types d'extincteurs (poudre, mousse ou CO2) peuvent être utilisés pour éteindre un feu de voiture, notamment en présence de carburant ou de matière inflammable." },
    { q: "En France, à partir de quelle quantité d'alcool pur par litre de sang un conducteur de camion titulaire du permis de conduire depuis plus de trois ans encourt-il une sanction ?", a: "0,50 g/l", e: "En France, un conducteur de camion titulaire du permis depuis plus de trois ans est sanctionné à partir de 0,50 gramme d'alcool par litre de sang." },

    { q: "Vous avez perdu votre « carte conducteur », pouvez-vous conduire en utilisant la carte « entreprise » que possède votre employeur ?", a: "Non", e: "Vous ne pouvez utiliser que votre carte conducteur personnelle, pas la carte « entreprise ». En cas de perte, vous devez signaler la perte et effectuer les démarches pour obtenir une nouvelle carte." },
    { q: "Effectuer un transport sous le régime « TIR » permet de simplifier les formalités douanières. Vrai ou Faux ?", a: "Vrai", e: "Le régime TIR (Transport International Routier) permet de simplifier les formalités douanières lors d'un transport international de marchandises." },
    { q: "Vous conduisez un camion comportant une caisse bâchée. Quelle peut être sa largeur maximale ?", a: "2,55 m", e: "La largeur maximale autorisée pour un camion avec une caisse bâchée est de 2,55 mètres ; elle passe à 2,60 mètres pour les véhicules frigorifiques." },
    { q: "Vous conduisez un camion neuf de 26 t de PTAC. À quelle vitesse êtes-vous limité sur autoroute ?", a: "90 km/h", e: "Un camion de 26 tonnes de PTAC est un poids lourd, et sur autoroute, la vitesse maximale autorisée pour les poids lourds est de 90 km/h." },
    { q: "Qu'aspire le moteur diesel lors du premier temps appelé « admission » ?", a: "De l'air", e: "Lors du premier temps, dit « admission », le piston descend et le moteur aspire de l'air dans le cylindre." },
    { q: "En règle générale, quelle est la durée minimale normale (non réduite) de repos hebdomadaire pour un conducteur de camions ?", a: "45 h", e: "En règle générale, le repos hebdomadaire normal (non réduit) d'un conducteur de camion est de 45 heures consécutives ; il est de 24 heures lorsqu'il est réduit." },
    { q: "Vous chargez du gravier. Vous voulez connaître la charge maximale autorisée par essieu, vous pouvez la trouver sur la plaque du constructeur. Vrai ou faux ?", a: "Vrai", e: "La charge maximale autorisée par essieu peut être indiquée sur la plaque du constructeur du véhicule, et non uniquement sur la plaque de tare et de surface." },
  ]},
  { n: 4, items: [
    { q: "Le modèle allemand, italien ou espagnol d'un constat européen d'accident, comporte-t-il les mêmes rubriques que le modèle français ?", a: "Oui", e: "Le constat européen d'accident existe dans plusieurs pays européens et comporte les mêmes rubriques ; seule la langue diffère." },
    { q: "Je possède les catégories B, C et CE. Conduire ma voiture personnelle après avoir pris de la drogue peut entraîner la perte de la catégorie B de mon permis de conduire uniquement. Vrai ou Faux ?", a: "Faux", e: "La conduite après avoir consommé des stupéfiants peut entraîner la perte de toutes les catégories du permis, et pas uniquement de la catégorie B." },
    { q: "Au bout de combien de jours, au maximum, l'entreprise doit-elle « télécharger » les données de votre carte conducteur ?", a: "28 jours", e: "L'entreprise doit télécharger les données de la carte conducteur au maximum tous les 28 jours." },
    { q: "Le temps de conduite pour venir à l'entreprise, le matin, avec votre véhicule personnel doit-il être ajouté au temps de conduite de votre véhicule lourd ?", a: "Non", e: "Les trajets effectués avec votre véhicule personnel pour vous rendre à l'entreprise ne sont pas ajoutés au temps de conduite de votre véhicule lourd." },
    { q: "Comment appelle-t-on les transports exécutés à titre non onéreux servant à transporter les marchandises de sa propre entreprise ?", a: "Compte propre (privé)", e: "Ce sont les transports réalisés à titre non onéreux, pour transporter les marchandises de sa propre entreprise et non celles d'un client." },
    { q: "Quelle est la longueur maximale d'un camion isolé à 2 essieux ?", a: "12 m", e: "La longueur maximale autorisée pour un camion isolé est de 12 mètres, quel que soit son nombre d'essieux." },
    { q: "Vous conduisez un camion neuf de 19 t de PTAC. À quelle vitesse êtes-vous limité sur route non prioritaire ?", a: "80 km/h", e: "Les camions isolés de plus de 3,5 tonnes de PTAC sont limités à 80 km/h maximum, que la route soit prioritaire ou non." },

    { q: "Le turbocompresseur a pour fonction de diminuer l'air admis dans les cylindres ?", a: "Non", e: "Le turbocompresseur a pour fonction d'augmenter la quantité d'air admise dans les cylindres, afin d'augmenter la puissance du moteur." },
    { q: "En circulation, le fait de freiner désactive obligatoirement le régulateur de vitesse. Vrai ou faux ?", a: "Vrai", e: "Le fait de freiner désactive généralement le régulateur de vitesse." },
  ]},
  { n: 5, items: [
    { q: "Le signal de détresse peut-il remplacer le triangle de présignalisation pour un véhicule d'un PTAC de plus de 3,5 t ?", a: "Non", e: "Pour un véhicule dont le PTAC est supérieur à 3,5 tonnes, le triangle de présignalisation reste obligatoire : le signal de détresse ne peut pas le remplacer." },
    { q: "Le non-respect des limitations de tonnage pour le passage sur les ponts peut-il entraîner une suspension du permis de conduire ?", a: "Oui", e: "Le non-respect d'une limitation de tonnage pour le passage sur un pont constitue une infraction pouvant entraîner une suspension du permis de conduire." },
    { q: "En double équipage, le temps passé sur la couchette d'un véhicule en circulation, est-il considéré comme repos journalier ?", a: "Non", e: "En double équipage, il est interdit de passer du temps sur la couchette pendant que le véhicule est en circulation ; ce temps n'est pas considéré comme du repos journalier." },

    { q: "Suite au contrôle technique périodique, quelle lettre figure sur le certificat d'immatriculation lorsque le véhicule est accepté ?", a: "La lettre A", e: "Lorsque le véhicule est accepté au contrôle technique, la lettre A est apposée sur le certificat d'immatriculation." },
    { q: "En règle générale, quel est le PTAC maximal d'un véhicule isolé comportant 2 essieux ?", a: "19 t", e: "Un véhicule isolé à deux essieux peut avoir, en règle générale, un PTAC maximal de 19 tonnes." },
    { q: "Vous conduisez un camion de plus de 7,5 t de PTAC. Quand finit l'interdiction de circulation en fin de semaine ?", a: "Dimanche à 22 h", e: "Pour un camion de plus de 7,5 tonnes de PTAC, l'interdiction de circuler en fin de semaine commence le samedi à 22 heures et se termine le dimanche à 22 heures." },
    { q: "Le circuit d'alimentation d'un moteur diesel se compose, entre autres éléments, de deux pompes : l'une est dite pompe d'injection haute pression, l'autre est dite pompe … ?", a: "D'alimentation", e: "Le circuit d'alimentation d'un moteur diesel comprend deux pompes : la pompe d'injection haute pression, et la pompe d'alimentation." },
    { q: "Votre véhicule est équipé d'un chronotachygraphe numérique. Vous avez perdu votre carte « conducteur », combien de jours, au maximum, pouvez-vous conduire sans carte ?", a: "15 jours", e: "En cas de perte de la carte conducteur, vous pouvez conduire sans carte pendant 15 jours maximum, à condition d'effectuer les démarches pour en obtenir une nouvelle et de pouvoir justifier la situation." },
    { q: "Dans un camion neuf, le passager doit-il obligatoirement attacher sa ceinture de sécurité ?", a: "Oui", e: "Dans un camion neuf, le passager doit également attacher obligatoirement sa ceinture de sécurité si le siège en est équipé." },
  ]},
  { n: 6, items: [
    { q: "Dans une longue descente, en cas de rupture de freins, si j'utilise une voie de détresse, le véhicule que je conduis sera-t-il gravement endommagé ?", a: "Non", e: "La voie de détresse est justement conçue pour immobiliser le véhicule en sécurité : certains éléments peuvent être abîmés, mais le véhicule ne sera pas gravement endommagé." },
    { q: "Quel symbole devez-vous afficher sur l'écran du chronotachygraphe numérique lorsque vous nettoyez votre véhicule ?", a: "Autres tâches (marteaux)", e: "Le nettoyage du véhicule doit être enregistré comme « autre tâche » (symbole des marteaux croisés) sur le chronotachygraphe." },
    { q: "La réglementation sociale européenne s'applique-t-elle à un conducteur non salarié propriétaire de son véhicule ?", a: "Oui", e: "La réglementation sociale européenne s'applique aussi aux conducteurs non salariés, même propriétaires de leur véhicule, dès lors qu'ils effectuent un transport concerné par cette réglementation." },

    { q: "Pour un camion carrossé dans un atelier agréé, quel est le délai maximal pour le présenter à la première visite technique ?", a: "12 mois (1 an)", e: "Pour un camion carrossé dans un atelier agréé, le délai maximal pour le présenter à sa première visite technique est d'un an." },
    { q: "Dans la définition du poids à vide, les différents réservoirs sont-ils remplis ?", a: "Oui", e: "Dans la définition du poids à vide, les différents réservoirs du véhicule sont considérés comme pleins." },
    { q: "Hors agglomération, sur une route à double sens, vous suivez un camion à 70 km/h. Quel intervalle de sécurité minimum devez-vous respecter ?", a: "50 m", e: "À 70 km/h hors agglomération, vous devez respecter une distance de sécurité minimale d'environ 50 mètres avec le véhicule qui vous précède." },
    { q: "Les filtres à carburant ou filtres principaux sont situés entre la pompe d'alimentation et la pompe d'injection haute pression. Vrai ou faux ?", a: "Vrai", e: "Les filtres à carburant principaux sont généralement situés entre la pompe d'alimentation et la pompe d'injection haute pression, afin de filtrer le carburant avant son entrée dans le circuit d'injection." },
    { q: "Le conducteur doit pouvoir présenter les preuves de son activité pour la journée en cours et pour les … jours précédents ?", a: "56 jours", e: "Le conducteur doit pouvoir présenter les preuves de son activité pour la journée en cours et pour les 56 jours précédents." },
    { q: "Au-delà de quel PTAC les véhicules de transport de marchandises doivent-ils être équipés d'un dispositif complémentaire de signalisation arrière ?", a: "6 t", e: "Les véhicules de transport de marchandises dont le PTAC dépasse 6 tonnes doivent être équipés d'un dispositif complémentaire de signalisation arrière." },
  ]},
  { n: 7, items: [
    { q: "En cas d'accident dans lequel votre véhicule est en cause, les forces de l'ordre peuvent-elles saisir votre carte « conducteur » ?", a: "Oui", e: "En cas d'accident dans lequel votre véhicule est en cause, les forces de l'ordre peuvent saisir votre carte conducteur afin de récupérer les données du chronotachygraphe utiles à l'enquête." },
    { q: "Quelle est la catégorie du permis exigée pour conduire un tracteur « en solo » de 10 t de PTAC et de 38 t de PTRA quand il circule non attelé d'une semi-remorque ?", a: "Le permis C", e: "La conduite d'un tracteur en solo dont le PTAC dépasse 3,5 tonnes nécessite le permis C." },
    { q: "Le conducteur peut-il bâcher ou débâcher son véhicule pendant une pause ?", a: "Non", e: "Le bâchage ou le débâchage du véhicule est considéré comme une activité de travail, et non comme une pause." },

    { q: "Comment s'appelle le document qui doit accompagner la marchandise lors de tout transport pour compte d'autrui ?", a: "Lettre de voiture", e: "La lettre de voiture est le document qui doit accompagner la marchandise lors d'un transport pour compte d'autrui ; elle contient les informations sur la marchandise, l'expéditeur et le destinataire." },
    { q: "Quelle est la longueur maximale d'un camion isolé à 3 essieux ?", a: "12 m", e: "Quel que soit le nombre d'essieux, la longueur maximale autorisée pour un camion isolé est de 12 mètres." },
    { q: "Votre camion, en charge, transporte des denrées périssables, avez-vous le droit de continuer votre trajet le samedi après 22 h ?", a: "Oui", e: "Les camions transportant des denrées périssables bénéficient d'une dérogation à l'interdiction générale de circulation de fin de semaine pour les véhicules de plus de 7,5 tonnes ; vous pouvez donc continuer votre trajet le samedi après 22 heures." },
    { q: "L'embrayage est un organe mécanique nécessaire au passage des vitesses sur les seules boîtes mécaniques ?", a: "Non", e: "Ici, il ne s'agit pas de la pédale d'embrayage mais de l'organe d'embrayage lui-même, présent aussi bien sur les boîtes mécaniques que sur les boîtes robotisées." },
    { q: "Quand le repos journalier est fractionné, quelle doit être la durée minimale totale de ce repos ?", a: "12 h", e: "Lorsque le repos journalier est fractionné, il comprend un premier repos d'au moins 3 heures consécutives, puis un second d'au moins 9 heures consécutives, soit un total de 12 heures minimum." },
    { q: "Vous suivez un véhicule dont les dispositifs réfléchissants sont triangulaires. Ce véhicule est probablement un véhicule isolé. Vrai ou Faux ?", a: "Faux", e: "Les dispositifs réfléchissants triangulaires se trouvent à l'arrière des remorques et semi-remorques, et non à l'arrière des véhicules isolés." },
  ]},

    { q: "Quelle est la durée maximale autorisée de conduite continue pour un conducteur de camion ?", a: "4 h 30", e: "Un conducteur de camion peut conduire 4h30 maximum en continu ; il doit ensuite respecter une pause d'au moins 45 minutes." },
    { q: "Quel symbole devez-vous afficher sur l'écran du chronotachygraphe numérique lorsque vous partez déjeuner ?", a: "Pause, repos", e: "Lorsque vous partez déjeuner, vous devez sélectionner le symbole « repos », car vous êtes en pause et ne réalisez aucune activité professionnelle." },
    { q: "Faut-il un seul certificat d'immatriculation pour un ensemble de véhicules constitué d'un camion de 19 t de PTAC auquel on a attelé une bétonnière sur roues de 400 kg ?", a: "Oui", e: "La bétonnière sur roues de 400 kg n'a pas besoin de son propre certificat d'immatriculation, car son PTAC est inférieur ou égal à 500 kg ; elle circule sous la plaque du camion qui la tracte." },
    { q: "En règle générale, le chargement peut-il dépasser l'aplomb avant du véhicule ?", a: "Non", e: "En règle générale, le chargement ne doit jamais dépasser l'aplomb avant du véhicule." },
    { q: "Au-dessous de quelle hauteur libre d'un pont celle-ci sera-t-elle signalée ?", a: "4,30 m", e: "La hauteur libre d'un pont est signalée lorsqu'elle est inférieure ou égale à 4,30 mètres, afin d'avertir les conducteurs des véhicules hauts." },
    { q: "Circuler avec un seul pneu lisse ou détérioré peut entraîner l'immobilisation du véhicule jusqu'à son remplacement. Vrai ou Faux ?", a: "Vrai", e: "Un seul pneu lisse ou détérioré peut entraîner l'immobilisation du véhicule jusqu'à son remplacement, car il représente un danger pour la sécurité routière." },
    { q: "La marche arrière sert à inverser le sens de rotation de l'arbre de transmission ?", a: "Oui", e: "La marche arrière permet d'inverser le sens de rotation de l'arbre de transmission, afin que les roues motrices tournent dans le sens opposé et fassent reculer le véhicule." },
    { q: "Le circuit électrique alimentant le chronotachygraphe est-il indépendant du circuit alimentant le coupe-batterie ?", a: "Oui", e: "Le circuit électrique du chronotachygraphe est indépendant du coupe-batterie, afin de garantir l'enregistrement des données même lorsque le coupe-batterie est actionné." },
  ]},
  { n: 9, items: [
    { q: "Les accidents corporels entre un poids lourd et une voiture sont majoritairement des accidents avec des véhicules circulant dans le même sens. Vrai ou Faux ?", a: "Vrai", e: "Les accidents corporels entre un poids lourd et une voiture sont majoritairement liés à des véhicules circulant dans le même sens, et sont plus souvent mortels dans le sens opposé." },

    { q: "Un premier arrêt de 15 mn sur un parking peut-il être considéré comme une pause ?", a: "Oui", e: "Un premier arrêt de 15 minutes peut être considéré comme une pause ; pour respecter la réglementation, il doit être complété par une seconde pause d'au moins 30 minutes." },
    { q: "Quel symbole devez-vous afficher sur l'écran du chronotachygraphe lors des vérifications du véhicule avant le départ ?", a: "Autres tâches (marteaux)", e: "Lors des vérifications du véhicule avant le départ, vous effectuez un travail : vous devez sélectionner le symbole « autre tâche » (marteaux croisés) sur le chronotachygraphe." },
    { q: "Que signifie la mention « TIR » placée sur une plaque à l'arrière du véhicule ?", a: "Transit International Routier", e: "La mention « TIR » signifie Transport International Routier." },
    { q: "Le poids réel d'un véhicule peut-il être égal à son PTAC ?", a: "Oui", e: "Le poids réel d'un véhicule peut être égal à son PTAC lorsqu'il est chargé au maximum autorisé, ce qui correspond exactement à sa limite." },
    { q: "En agglomération, vous suivez un camion. Quel intervalle de sécurité minimum devez-vous respecter ?", a: "Distance parcourue en 2 secondes", e: "Même en agglomération, lorsque vous suivez un camion, vous devez respecter un intervalle de sécurité d'au moins deux secondes, pour avoir le temps de réagir en cas de ralentissement ou d'arrêt." },
    { q: "Dans une entreprise, le chargement est effectué par un manutentionnaire. Une fois terminé, vous appartient-il d'effectuer le contrôle de l'arrimage avant de démarrer ?", a: "Oui", e: "Même si le chargement est effectué par un manutentionnaire, le conducteur reste responsable du contrôle de l'arrimage avant le départ." },
    { q: "Un pont court permet d'obtenir un couple plus important et une vitesse du véhicule plus faible. Vrai ou faux ?", a: "Vrai", e: "Un pont court permet d'obtenir un couple plus important aux roues, facilitant le démarrage et la montée des côtes, mais à régime moteur égal le véhicule roule à une vitesse plus faible." },
    { q: "Quelle est la périodicité des vérifications techniques obligatoires pour les chronotachygraphes ?", a: "2 ans", e: "Le chronotachygraphe doit faire l'objet d'une vérification technique obligatoire tous les deux ans, réalisée par un centre agréé." },
  ]},
  { n: 10, items: [
    { q: "Si une partie de votre chargement est tombée sur la chaussée, par quel dispositif obligatoire devez-vous prévenir les autres usagers ?", a: "Un triangle de présignalisation", e: "Si une partie de votre chargement tombe sur la chaussée et ne peut être retirée immédiatement, vous devez signaler l'obstacle avec un triangle de présignalisation." },
    { q: "Après l'obtention (hors diplômes professionnels) de votre premier permis de conduire du groupe lourd, quelle formation devez-vous effectuer avant de pouvoir conduire un véhicule dans le cadre d'un transport public de marchandises ?", a: "La FIMO (Formation Initiale Minimale Obligatoire)", e: "Après l'obtention de votre premier permis poids lourd, vous devez suivre une FIMO marchandises de 140 heures, sauf si vous possédez un diplôme professionnel reconnu." },
    { q: "Si vous avez à imprimer un ticket à partir d'un chronotachygraphe numérique, devez-vous inscrire votre nom sur le ticket, si votre carte « conducteur » est insérée dans l'appareil au moment de l'impression ?", a: "Non", e: "Si votre carte conducteur est insérée dans le chronotachygraphe numérique au moment de l'impression, votre nom est automatiquement enregistré sur le ticket : il n'est donc pas nécessaire de l'inscrire manuellement." },
    { q: "Quelle est la durée de validité de votre carte « conducteur » ?", a: "5 ans", e: "La carte conducteur du chronotachygraphe est valable cinq ans." },
    { q: "La dernière visite technique de votre camion date de 8 mois. Êtes-vous en infraction en le conduisant ?", a: "Non", e: "Vous n'êtes pas en infraction : pour un camion de transport de marchandises, le contrôle technique est obligatoire chaque année. Si le dernier contrôle date de huit mois, il reste quatre mois avant la prochaine échéance." },
    { q: "En règle générale, quel est le PTAC maximal d'un véhicule isolé de 3 essieux ?", a: "26 t", e: "Le PTAC maximal général d'un véhicule isolé à trois essieux est de 26 tonnes." },
    { q: "En général, un véhicule tracteur en solo est-il soumis aux mêmes limitations de vitesse que s'il est attelé ?", a: "Oui", e: "Un tracteur routier en solo est soumis aux mêmes limitations de vitesse que lorsqu'il est attelé : 60 km/h sur route non prioritaire, 80 km/h sur route prioritaire, 90 km/h sur autoroute." },

    { q: "Le mécanisme de l'assistance de direction comprend une « bielle pendante ». Vrai ou faux ?", a: "Vrai", e: "La bielle pendante fait partie du mécanisme de direction : elle transmet le mouvement du boîtier de direction à la timonerie pour orienter les roues." },
    { q: "En cas d'obligation, une paire de chaînes à neige doit être montée sur les roues motrices ou sur les roues directrices ?", a: "Les roues motrices", e: "En cas d'obligation, une paire de chaînes à neige doit être montée sur les roues motrices, car ce sont elles qui transmettent la puissance du moteur à la chaussée." },
  ]},
  { n: 11, items: [
    { q: "Un chiffre doublé (ex : 33) dans le rectangle du haut de la plaque orange placée à l'arrière d'un camion signifie : « produit de nature à polluer les eaux ». Vrai ou faux ?", a: "Faux", e: "Un chiffre doublé sur la plaque orange (par exemple 33) indique une intensification du danger : 33 signifie liquide très inflammable." },
    { q: "Avec le permis C, quel est le PTAC maximum de la remorque que vous pouvez atteler derrière votre camion ?", a: "750 kg", e: "Avec le permis C, vous pouvez atteler une remorque dont le PTAC ne dépasse pas 750 kg." },
    { q: "Le conducteur d'un véhicule de dépannage, est-il soumis à la réglementation sociale européenne, dans un rayon de 100 km autour de son point d'attache ?", a: "Non", e: "Les conducteurs de véhicules spécialisés de dépannage opérant dans un rayon de 100 km autour de leur point d'attache sont exclus de la réglementation sociale européenne (temps de conduite et de repos)." },
    { q: "Un conducteur peut-il demander une copie papier des données numériques, liées à son activité, qui sont conservées dans l'entreprise ?", a: "Oui", e: "Le conducteur peut demander à son entreprise une copie papier des données numériques liées à son activité, conservées pendant un an dans l'entreprise." },
    { q: "La lettre de voiture doit détailler la nature des marchandises transportées. Vrai ou faux ?", a: "Vrai", e: "La lettre de voiture doit détailler la nature des marchandises transportées, ainsi que l'expéditeur et le destinataire." },
    { q: "Quelle est la charge utile d'un véhicule dont le PTAC est de 32 t et le poids à vide de 9 t ?", a: "23 t", e: "Calcul de la charge utile : PTAC − poids à vide, soit 32 t − 9 t = 23 tonnes." },
    { q: "Sur le périphérique parisien, les camions peuvent circuler à 80 km/h. Vrai ou Faux ?", a: "Faux", e: "Sur le périphérique parisien, la vitesse maximale est fixée à 50 km/h pour l'ensemble des véhicules depuis octobre 2024." },

    { q: "Quel type de suspension équipe généralement les véhicules lourds permettant de régler la hauteur du véhicule ?", a: "La suspension pneumatique", e: "La suspension pneumatique permet de régler la hauteur du véhicule grâce à des coussins d'air." },
    { q: "Le principal avantage du système de freinage antibloquant est-il de réduire les distances de freinage ?", a: "Non", e: "Le principal avantage du système de freinage antiblocage (ABS) est d'éviter le blocage des roues lors d'un freinage d'urgence, permettant ainsi de conserver la capacité à diriger le véhicule." },
  ]},
  { n: 12, items: [
    { q: "Le constat amiable d'accident peut-il constituer une preuve de responsabilité ?", a: "Oui", e: "Le constat amiable d'accident peut constituer une preuve de responsabilité, car il décrit les circonstances de l'accident et les déclarations des conducteurs." },
    { q: "Un conducteur ramenant, à vide, un camion citerne de carburant, non dégazé, doit-il obligatoirement avoir suivi une formation particulière ?", a: "Oui", e: "Un conducteur qui ramène, à vide, un camion-citerne de carburant non dégazé doit avoir suivi une formation spécifique ADR : le gaz résiduel reste un produit dangereux." },

    { q: "Sur un ticket imprimé à partir du chronotachygraphe numérique, peut-on trouver les temps de conduite et les temps passés aux autres tâches ?", a: "Oui", e: "Sur un ticket imprimé à partir du chronotachygraphe numérique, on retrouve les temps de conduite ainsi que les temps consacrés aux autres activités (autres tâches, disponibilité, repos)." },
    { q: "La licence communautaire permet-elle d'effectuer des transports dans toute l'Union européenne ?", a: "Oui", e: "La licence communautaire permet d'effectuer des transports internationaux de marchandises par route dans l'ensemble de l'Union européenne, dans le respect de la réglementation en vigueur." },
    { q: "Quelle charge maximale autorisée peut supporter un essieu isolé ?", a: "13 t", e: "La charge maximale autorisée pour un essieu isolé d'un véhicule lourd est généralement de 13 tonnes." },
    { q: "Vous conduisez un camion neuf de 19 t de PTAC. À quelle vitesse êtes-vous limité sur route prioritaire ?", a: "80 km/h", e: "Un camion isolé de plus de 3,5 tonnes de PTAC est limité à 80 km/h, que la route soit prioritaire ou non, sauf indication contraire." },
    { q: "Le recreusage des pneumatiques est-il une opération qui peut s'effectuer uniquement par un spécialiste ?", a: "Oui", e: "Le recreusage des pneumatiques doit être réalisé par un spécialiste, afin de respecter les caractéristiques techniques et les règles de sécurité propres au pneu." },
    { q: "Vous avez fait une coupure de 4 h (repos), quelle sera, au minimum, la durée de la période de repos suivante pour être en règle vis-à-vis du repos journalier ?", a: "9 h", e: "Le repos journalier fractionné se compose d'une première période d'au moins 3 heures de repos consécutives (ici 4 heures), suivie d'une seconde période d'au moins 9 heures consécutives." },
    { q: "Vous chargez du sable. Vous voulez connaître la charge maximale autorisée par essieu, vous pouvez la trouver sur la plaque de tare et de surface. Vrai ou faux ?", a: "Faux", e: "Pour connaître les charges maximales par essieu, il faut notamment consulter la plaque du constructeur." },
  ]},
  { n: 13, items: [
    { q: "Dans le transport routier, c'est pendant le travail, hors conduite, que l'on dénombre le plus fort taux d'accidents chez les conducteurs ?", a: "Oui", e: "Dans le transport routier, une part importante des accidents chez les conducteurs survient pendant le travail hors conduite, notamment lors du chargement, du déchargement, et de la montée ou descente du véhicule." },
    { q: "En cas d'excès de vitesse de 42 km/h, je pourrai repartir si je reconnais l'infraction ?", a: "Non", e: "En cas d'excès de vitesse égal ou supérieur à 40 km/h constaté avec interception du véhicule, les forces de l'ordre peuvent retenir votre permis de conduire ; vous ne pouvez donc pas repartir immédiatement, et le véhicule peut également être immobilisé." },
    { q: "Pendant une pause, êtes-vous autorisé à décharger le véhicule ?", a: "Non", e: "Pendant une pause réglementaire, vous devez être libre de votre temps : le déchargement est considéré comme du travail et ne peut donc pas être effectué pendant cette pause." },
    { q: "Vous avez fait une coupure de 2 h, quelle sera, au minimum, la durée (non réduite) de la période de repos que vous devrez prendre à la fin de votre journée de travail pour être en règle vis-à-vis du repos journalier ?", a: "11 h", e: "Une coupure de 2 heures ne peut pas servir à fractionner le repos journalier, la première période devant être d'au moins 3 heures ; vous devez donc prendre un repos journalier non réduit de 11 heures consécutives en fin de journée de travail." },
    { q: "La date limite de validité de la dernière visite technique est-elle inscrite sur le certificat d'immatriculation du véhicule ?", a: "Oui", e: "La date limite de validité du dernier contrôle technique est inscrite sur le certificat d'immatriculation, grâce au timbre apposé par le contrôleur." },
    { q: "Vous conduisez un camion comportant une caisse réfrigérée. Quelle peut être sa largeur maximale ?", a: "2,60 m", e: "Un camion équipé d'une caisse réfrigérée peut avoir une largeur maximale de 2,60 mètres, contre 2,55 mètres pour les autres véhicules." },
    { q: "Je conduis un camion de 26 t de PTAC et de 10 t de PV. Pour emprunter une route où une barrière de dégel à 12 t avec mention demi-charge autorisée est en place, quel doit être le poids maximum de mon chargement ?", a: "8 t", e: "Après avoir calculé la charge utile (PTAC − poids à vide, soit 26 t − 10 t = 16 tonnes), on la divise par deux pour obtenir la moitié du chargement, soit 8 tonnes." },
    { q: "Par temps sec, ce signal (accotement meuble) me concerne-t-il ?", a: "Oui", e: "Le panneau « accotement meuble » signale un risque d'enfoncement ou de renversement si vous circulez ou vous arrêtez sur l'accotement ; ce danger existe même par temps sec.", img: "data:image/webp;base64,UklGRoggAABXRUJQVlA4IHwgAADweQCdASrwABIBPlEkjkUjoiETuY4QOAUEpuul/Fn5+U7l7FPUvx9/Lv5mqa/Kvvb/Wf+v/perNqfzwfDfyj/B/0v+3f4r/Gf////94DzAP4B/Ev8/1EvMB+5/65e+x6GvQA/WD///z/tA/QA/dH1av9B/y/9x+///4+z79nf+t/fv+z/////9if6+//r98PgA9AD/79XP1M/u/9V/WXwB/vv9p/a792vM185/df6z+0n7ye63/C+RvnP/e+in8R+vv47+6/tR/f/2a+/X8x/j/x3/GD2b+P/+D6gv5B/Of83/av2o/LnjxQAfVr/M/3/9pP796QX8z6C/Yb2AP5Z/M/9d+cfwz/yP1a8oT7n/sPYB/ov9p/4H+S/Kf6Zf5D/m/4j/M/tV7X/0P+/f9j/C/6v9rvsL/mP9U/4P9z/zv/u/zX//+rn//+3f9wv//7ov7Q//g8NZwQemul671J9CFso5K3WPy7nmGZwSJG7STOQJJnmV0tPwuBI2EBUWUjRtZwSI4XRNzfHtgOF6WcVPs7Lmk5NgssLhZwSEAiECAYBBveWsSfkl4uutYturlUJxlikcQ3kv64WSnd2IZpZUjVJqQS0s4COv0ZWLYG3Leez5OMLy72Zo0Rc2zSC007dM0QNoyVjS0HV8FJLe9a+1ym8zRtLQwqiH2V9JOaxx7yJVEo88rthxxW6OtNZGPcuC/R4GUsJqilEFTXmxpspnRmVswV3oAVG9FhQLL8oWOwkBEIEKsucZRTQnnXDujHu9rQS0ZyqkP0iWn6B4ahNwk/bWXJDgqtfUXFThOJ9evOl1/m71HJ4kRis3e/hAvbry02wriYcmHf0koBz5WkDSa4AWDsOFQOOGYAoNwhcK7BgslfN7hoEzdBkTtzcnTz7zUN0cvdCrjTFK1RipTtL1GzsVX/iPNPQVfS77sxjLDQAtuBRz6Ls10mn4pjymn+qULJQhjSm4NsG1u628EsAAd82WglFCkuf/xr4+3WDKt0FbqyoJwlBx2B/DT/0l0QmbiPTsRNRtrTj035wD6HGyjx8dyqtJPzSydR8xYek36VXmjrN69/H/iTgUG6SHW1d78q4QsvjCajbG6dHQnl43ADeqrBB4Jta+sd1tGG+hFLON38YAnvaT1Lzo5tk6LOxWRwPmKC76nQuR24ocfz2TdBl/53YhVGaQVU5Co6yiFF0gOVJJjTkAu2hFUfDqxXU2JcpkNe41enZVJbMM+VjZ30GJkqRAIwXKjp8JqmCvzpR1J1Mq3DfXYuyDk67O7uyMZGaOQ9Zj7+rjrPdgFBASebJfUv1NTgAA/v2xASEPxdNs/eUEAlcOqj7ZZx8kurydoZDrvQ3Ows+l8gP037c5D9VZB6TUWUxVFwy5dua5nb/NoBy7xNivA7fOcb5FbcXJQHOMWNIJpxAK8bSGAOVQecRPtKFM8f02SQ884lKUIttLfBHdt3N9yGo6xrwXUPjwo0a57UH1dSJ1I5QFBvcaX2+Hovg1xhAYxkCIvLHkNtqQTbg5sJqVog388lGvhtWsHuZ2OenMNvEgqmwq8jpIotX0y+KIhTSOGb/ailgcU6spXkRzoP9px2zMjMw+LD3XAsvdyoO2X12o1ClqaCirMm7qABF1w7GCspZNYJPElRIIap/IDB60bUZfTxdo8On1OMr4wSTntw0Bxl     { q: "Lorsque le conducteur serre le frein de parc, le cylindre de frein à ressort se remplit d'air. Vrai ou faux ?", a: "Faux", e: "Lorsque le conducteur serre le frein de parc, l'air est évacué du cylindre de frein à ressort, et le ressort se détend pour appliquer le freinage." },
    { q: "Quelle est la profondeur minimale (en millimètre) des rainures principales d'un pneumatique de poids lourd ?", a: "1 mm", e: "La profondeur minimale légale des rainures principales d'un pneumatique de poids lourd en France est de 1 millimètre." },
  ]},
  { n: 14, items: [
    { q: "En cas d'accident, les données du chronotachygraphe numérique peuvent-elles servir de preuve devant un tribunal ?", a: "Oui", e: "Les données du chronotachygraphe numérique peuvent servir de preuve devant un tribunal en cas d'accident, en permettant notamment de vérifier les temps de conduite, les vitesses enregistrées et les activités du conducteur." },
    { q: "Si je perds tous les points de mon permis de conduire, à la suite d'infractions commises au volant de ma voiture personnelle, pourrai-je continuer à conduire mon camion ?", a: "Non", e: "Si vous perdez tous les points de votre permis de conduire à la suite d'infractions commises avec votre voiture personnelle, votre permis est invalidé pour toutes les catégories, y compris le permis C." },

    { q: "Vous conduisez sans vous arrêter depuis 8 h ce matin. Il est 12 h 40. Êtes-vous en infraction ?", a: "Oui", e: "La durée maximale de conduite continue est de 4h30. En partant à 8h et en s'arrêtant à 12h40, la durée de conduite est de 4h40, soit un dépassement de 10 minutes." },
    { q: "Lors d'un contrôle des temps de conduite et de repos sur la route, en plus de la journée en cours, sur quelle période devez-vous pouvoir présenter les données ?", a: "Les 56 jours précédents", e: "Lors d'un contrôle routier, vous devez pouvoir présenter les données de temps de conduite et de repos de la journée en cours ainsi que des 56 jours précédents." },
    { q: "Vous conduisez un véhicule isolé à 2 essieux. Est-il possible d'être en surcharge sur l'essieu arrière si le poids réel ne dépasse pas le PTAC ?", a: "Oui", e: "Il est possible d'être en surcharge sur l'essieu arrière même si le poids réel total ne dépasse pas le PTAC, lorsque le chargement est mal réparti et pèse trop sur cet essieu." },
    { q: "Vous conduisez un camion neuf de 19 t de PTAC. À quelle vitesse êtes-vous limité sur route à sens unique prioritaire ?", a: "80 km/h", e: "Pour un camion de plus de 3,5 tonnes de PTAC, la vitesse maximale autorisée sur route prioritaire comme non prioritaire est de 80 km/h." },
    { q: "Le circuit de freinage européen rend le freinage de l'essieu avant indépendant du freinage de l'essieu arrière. Vrai ou faux ?", a: "Vrai", e: "Le circuit de freinage européen comporte deux circuits indépendants, un pour l'essieu avant et un pour l'essieu arrière ; en cas de défaillance de l'un, l'autre assure un freinage de secours." },
    { q: "Vous vous arrêtez pour faire le plein de carburant. Sur quel symbole devez-vous positionner le sélecteur d'activité du chronotachygraphe ?", a: "Autres tâches", e: "Lorsque vous vous arrêtez pour faire le plein de carburant, vous n'êtes ni en conduite ni en repos : vous effectuez une « autre tâche », à sélectionner sur le chronotachygraphe (symbole des marteaux croisés)." },
    { q: "Au-delà de quel PTAC un extincteur à poudre de 6 kg minimum, placé à l'extérieur, doit-il équiper un camion neuf ?", a: "7,5 t", e: "Un camion de plus de 7,5 tonnes de PTAC doit être équipé d'un extincteur à poudre de 6 kg minimum, placé à l'extérieur du véhicule." },
  ]},
  { n: 15, items: [
    { q: "Sur autoroute, en cas d'incident, pour appeler les secours, vaut-il mieux utiliser une borne d'appel ou son téléphone portable ?", a: "La borne d'appel", e: "Sur autoroute, en cas d'accident, la borne d'appel d'urgence permet de vous localiser plus facilement et de transmettre votre demande directement au service compétent." },
    { q: "Sur une route à double sens limitée à 70 km/h, lors d'un contrôle routier, votre carte conducteur indique que vous rouliez à 80 km/h. Pouvez-vous être sanctionné ?", a: "Oui", e: "La vitesse maximale autorisée est de 70 km/h et le chronotachygraphe indique 80 km/h : vous dépassez donc la limite de 10 km/h et pouvez être sanctionné pour excès de vitesse." },
    { q: "Vous rentrez chez vous le soir avec le camion de l'entreprise. Le matin, le temps de conduite pour vous rendre au dépôt est-il compté comme du temps de conduite ?", a: "Oui", e: "Toute conduite effectuée avec le camion de l'entreprise, y compris le trajet du soir, doit être enregistrée sur le chronotachygraphe et comptée dans vos limites de conduite." },
    { q: "Après 2 heures de conduite, quelle est la durée minimale d'un premier arrêt pouvant être pris en compte comme pause ?", a: "15 mn", e: "Après deux heures de conduite, un premier arrêt d'au moins 15 minutes peut constituer la première partie de la pause réglementaire ; il faudra ensuite, avant 4h30 de conduite, prendre une seconde pause de 30 minutes." },
    { q: "Dans le cadre d'un transport public, peut-il y avoir une lettre de voiture (avec état récapitulatif) dans le véhicule pour plusieurs voyages ?", a: "Oui", e: "Dans le cadre d'un transport public de marchandises, une lettre de voiture avec état récapitulatif peut être utilisée pour plusieurs voyages, sous certaines conditions réglementaires." },
    { q: "Quelle est la majoration maximale autorisée du PTAC pour un véhicule équipé d'un dispositif ralentisseur pesant 400 kg ?", a: "400 kg", e: "La majoration maximale autorisée du PTAC est égale au poids du dispositif ralentisseur, dans la limite de 500 kg ; pour un ralentisseur de 400 kg, la majoration est donc de 400 kg." },
    { q: "Vous conduisez un tracteur solo de 19 t de PTAC et 38 t de PTRA. À quelle vitesse êtes-vous limité sur route non prioritaire ?", a: "60 km/h", e: "Avec un tracteur solo, vous êtes limité à 60 km/h sur une route non prioritaire." },

    { q: "Le dispositif antiblocage de roues (ABS) peut-il fonctionner en même temps que le ou les dispositifs ralentisseurs ?", a: "Oui", e: "Le dispositif antiblocage des roues (ABS) peut fonctionner en même temps que les dispositifs ralentisseurs, l'un n'empêchant pas le fonctionnement de l'autre." },
    { q: "Où doit se trouver l'extincteur obligatoire sur un véhicule isolé neuf de transport de marchandises de plus de 7,5 t : à l'intérieur ou à l'extérieur ?", a: "À l'extérieur", e: "Pour un véhicule isolé neuf de plus de 7,5 tonnes de PTAC affecté au transport de marchandises, l'extincteur obligatoire doit se trouver à l'extérieur du véhicule, dans un emplacement facilement accessible." },

  { n: 16, items: [
    { q: "Que signifie une plaque de couleur orange, comportant 2 rectangles sans inscription, placée à l'arrière d'un camion ?", a: "Transport de matières dangereuses", e: "Une plaque orange composée de deux rectangles sans inscription, placée à l'arrière d'un camion, indique généralement un transport de matières dangereuses conditionnées en colis." },
    { q: "Lors d'un contrôle sur la route, est-il obligatoire de pouvoir présenter votre carte de qualification conducteur (CQC) ?", a: "Oui", e: "Lors d'un contrôle routier, vous devez pouvoir justifier votre qualification professionnelle, par exemple via votre carte de qualification conducteur (CQC)." },

    { q: "Vous avez interrompu votre conduite pendant 45 mn. Ce temps peut-il être pris en compte pour le calcul du temps de repos journalier ?", a: "Non", e: "Une interruption de conduite de 45 minutes correspond bien à une pause réglementaire, mais ne peut pas être comptabilisée dans le calcul du repos journalier, qui exige, en cas de fractionnement, une première période d'au moins 3 heures suivie d'une seconde d'au moins 9 heures." },
    { q: "Dans le cadre du transport public, peut-il y avoir une seule lettre de voiture (avec état récapitulatif) dans le véhicule pour un transport comportant plusieurs destinataires dans la même journée ?", a: "Oui", e: "Dans le cadre d'un transport public de marchandises, une seule lettre de voiture avec état récapitulatif peut suffire pour un transport comportant plusieurs destinataires au cours de la même journée." },
    { q: "Vous transportez du béton liquide. Votre camion (isolé) comporte 4 essieux. Lors de la pesée avant de partir, le ticket annonce 30,5 t. Avez-vous le droit de prendre la route ?", a: "Oui", e: "Le PTAC maximal pour un véhicule isolé à 4 essieux est de 32 tonnes ; avec un poids réel de 30,5 tonnes, vous restez donc sous cette limite." },
    { q: "Vous conduisez un tracteur solo de 19 t de PTAC et 38 t de PTRA. À quelle vitesse êtes-vous limité sur route prioritaire ?", a: "80 km/h", e: "Avec un tracteur solo de plus de 3,5 tonnes de PTAC, vous êtes limité à 80 km/h sur route prioritaire et à 60 km/h sur route non prioritaire." },
    { q: "En principe, le ralentisseur hydraulique est situé sur … ?", a: "La transmission (l'arbre de transmission)", e: "Le ralentisseur hydraulique est généralement situé en sortie de boîte de vitesses, sur la chaîne cinématique (transmission)." },
    { q: "En règle générale, quelle est la durée minimale normale (non réduite) obligatoire de repos journalier lorsque celui-ci n'est pas fractionné ?", a: "11 h", e: "La durée minimale normale de repos journalier non fractionné est de 11 heures consécutives." },
    { q: "Quel type d'extincteur faut-il éviter d'utiliser pour éteindre les flammes d'un feu d'hydrocarbure ?", a: "Un extincteur à eau", e: "Il faut éviter d'utiliser un extincteur à eau sur un feu d'hydrocarbure, au risque de propager les flammes ; il faut privilégier un extincteur à poudre ou à mousse." },
  ]},
  { n: 17, items: [
    { q: "Dans le transport, les accidents avec blessures du chauffeur sont plus nombreux en circulation que hors circulation. Vrai ou Faux ?", a: "Faux", e: "Les accidents avec blessures du chauffeur sont plus nombreux hors circulation que pendant la conduite, notamment lors des opérations de chargement, déchargement, montée et descente du véhicule." },
    { q: "Quelle est la catégorie du permis exigée pour conduire un véhicule de transport en commun comportant 45 places circulant à vide ?", a: "Le permis D", e: "Pour conduire un véhicule de transport en commun de plus de neuf places assises, conducteur compris, même circulant à vide, le permis D est exigé." },
    { q: "Pendant une pause, êtes-vous autorisé à ranger le chargement du véhicule ?", a: "Non", e: "Une pause suppose l'absence de toute activité professionnelle : le rangement du chargement doit être effectué en temps de travail, pas pendant la pause." },

    { q: "Comment appelle-t-on les transports exécutés à titre onéreux pour le compte d'un client ?", a: "Publics (compte d'autrui)", e: "Lorsque vous transportez des marchandises pour le compte d'un client, en échange d'une rémunération, il s'agit de transport public ou pour compte d'autrui." },
    { q: "En règle générale, de quelle longueur maximale un chargement muni d'une signalisation réglementaire peut-il dépasser l'arrière du véhicule ?", a: "3 m", e: "En règle générale, un chargement peut dépasser l'arrière du véhicule jusqu'à 3 mètres maximum, à condition d'être équipé d'une signalisation réglementaire au-delà d'un mètre de dépassement." },
    { q: "Vous conduisez un tracteur solo de 19 t de PTAC et 38 t de PTRA. À quelle vitesse êtes-vous limité sur route à sens unique prioritaire ?", a: "80 km/h", e: "Avec un tracteur solo de plus de 3,5 tonnes de PTAC, la vitesse maximale sur route à sens unique prioritaire est de 80 km/h, et de 60 km/h sur route non prioritaire." },
    { q: "Parmi les types de graissage moteur, il existe le graissage par barbotage. Vrai ou faux ?", a: "Vrai", e: "Le graissage par barbotage est un type de graissage moteur où les pièces mécaniques en mouvement, plongées dans l'huile, la projettent sur les éléments à lubrifier." },
    { q: "La rémunération mensuelle d'un conducteur salarié peut être calculée en fonction de la charge transportée pendant le mois. Vrai ou Faux ?", a: "Faux", e: "La rémunération mensuelle d'un conducteur salarié ne doit pas être calculée en fonction de la quantité de marchandises transportées, afin de ne pas encourager la surcharge ou le non-respect des règles de sécurité." },
    { q: "En cas de panne du chronotachygraphe, le délai maximal de remise en état, à compter de la panne, est fixé à … ?", a: "1 semaine (7 jours)", e: "En cas de panne du chronotachygraphe, le délai maximal de remise en état est fixé à une semaine (sept jours)." },
  ]},
  { n: 18, items: [
    { q: "Pour diminuer les risques d'accident, lors de la montée ou de la descente d'un camion, de combien de points d'appui le conducteur doit-il se servir ?", a: "3", e: "Pour monter ou descendre d'un camion en toute sécurité, le conducteur doit conserver trois points d'appui (deux mains et un pied, ou deux pieds et une main)." },

    { q: "Si, dans la même journée, vous conduisez un véhicule avec un chronotachygraphe numérique après avoir conduit un véhicule avec un chronotachygraphe à disque, devez-vous conserver le disque avec vous ?", a: "Oui", e: "Vous devez conserver le disque utilisé et être en mesure de le présenter en cas de contrôle." },
    { q: "Une huile multigrade classée SAE 20W40 peut-elle être utilisée uniquement en hiver ?", a: "Non", e: "Une huile multigrade classée SAE 20W40 peut être utilisée aussi bien en hiver qu'en été : le « 20W » est l'indice pour le froid, le « 40 » celui pour le chaud." },
    { q: "Suite au contrôle technique périodique, lorsque le véhicule est refusé sans interdiction de circuler, dans quel délai maximum la contre-visite doit-elle être effectuée pour éviter une visite technique complète ?", a: "1 mois", e: "Pour un véhicule lourd, la contre-visite après un contrôle technique périodique défavorable doit être effectuée dans un délai maximal d'un mois, afin d'éviter une visite technique complète." },
    { q: "Vous conduisez un camion de 2,50 m de large ne comportant pas de caisse réfrigérée. Votre chargement peut-il atteindre 2,60 m de large ?", a: "Non", e: "La largeur maximale autorisée du chargement reste de 2,55 mètres même si le camion mesure 2,50 mètres de large ; le dépassement à 2,60 mètres est réservé aux véhicules à caisse réfrigérée." },
    { q: "Un véhicule isolé de 26 t de PTAC doit comporter à l'arrière un ou des disque(s) de limitation de vitesse. Quelle(s) est ou sont la ou les vitesse(s) indiquée(s) à l'arrière de ce camion ?", a: "80 - 90 km/h", e: "Pour un véhicule isolé de plus de 2 tonnes de PTAC, les disques de limitation de vitesse à l'arrière indiquent 90 km/h et 80 km/h." },
    { q: "Au-delà de quel taux de surcharge (en %) le camion pourra-t-il être immobilisé, jusqu'au déchargement de l'excédent ?", a: "5 %", e: "Le camion peut être immobilisé jusqu'au déchargement de l'excédent lorsque le taux de surcharge dépasse 5 %." },
    { q: "La rémunération mensuelle d'un conducteur salarié peut être calculée en fonction de la distance parcourue pendant le mois. Vrai ou Faux ?", a: "Faux", e: "La rémunération mensuelle d'un conducteur salarié ne doit pas être calculée en fonction de la distance parcourue, afin de ne pas inciter au dépassement des temps de conduite ou de travail." },
    { q: "En règle générale, existe-t-il une commande indépendante de frein de secours à l'intérieur des véhicules lourds neufs ?", a: "Non", e: "En règle générale, il n'existe pas de commande indépendante de frein de secours à l'intérieur des véhicules lourds neufs." },
  ]},
  { n: 19, items: [
    { q: "Le nombre 33 dans le rectangle du haut de la plaque orange placée à l'arrière d'un camion signifie : « produit très inflammable ». Vrai ou faux ?", a: "Vrai", e: "Le nombre 33 figurant en partie haute de la plaque orange ADR signifie « liquide très inflammable »." },
    { q: "En cas de récidive de grand excès de vitesse, une suspension du permis de conduire peut être assortie d'un permis limité à la conduite professionnelle (permis blanc) si l'infraction a été commise avec la voiture personnelle du chauffeur. Vrai ou Faux ?", a: "Faux", e: "En cas de récidive de grand excès de vitesse (50 km/h ou plus), l'annulation du permis de conduire est encourue ; le « permis blanc », qui n'existe d'ailleurs plus, ne permettait pas de continuer à conduire à titre professionnel." },
    { q: "Si vous avez à imprimer un ticket à partir d'un chronotachygraphe numérique, devez-vous inscrire votre nom sur le ticket, si votre carte « conducteur » est retirée de l'appareil au moment de l'impression ?", a: "Non", e: "Les informations étant enregistrées automatiquement puisque la carte conducteur était insérée pendant l'impression, il n'est pas utile d'inscrire manuellement son nom sur le ticket." },
    { q: "Vous conduisez sans vous arrêter depuis 8 h 40 ce matin. Il est 12 h 40. Êtes-vous en infraction ?", a: "Non", e: "La durée maximale de conduite continue autorisée est de 4h30 avant pause réglementaire de 45 minutes ; en conduisant de 8h40 à 12h40, soit 4 heures, vous n'êtes pas encore en infraction." },
    { q: "Suite au contrôle technique périodique, quelle lettre figure sur le certificat d'immatriculation lorsque le véhicule est refusé sans interdiction de circuler ?", a: "La lettre S", e: "Lorsque le véhicule est refusé au contrôle technique sans interdiction de circuler, la lettre S figure sur le certificat d'immatriculation." },
    { q: "Le chargement d'un véhicule peut-il dépasser 4 m de haut ?", a: "Oui", e: "En France, il n'existe pas de limite réglementaire générale de hauteur pour le chargement d'un véhicule, mais le conducteur doit s'assurer qu'il peut franchir les ouvrages rencontrés (ponts, tunnels...)." },
    { q: "Au-delà de quel tonnage les camions sont-ils concernés par les interdictions de circuler de fin de semaine ?", a: "7,5 t", e: "Les camions affectés au transport routier de marchandises sont concernés par les interdictions de circuler de fin de semaine dès lors que leur PTAC dépasse 7,5 tonnes." },

    { q: "En moyenne, il y a plus d'accidents graves impliquant un poids lourd les samedis et veilles de jours fériés que les jours de semaine. Vrai ou Faux ?", a: "Faux", e: "Les poids lourds circulent davantage en semaine, ce qui augmente leur exposition au risque d'accident par rapport aux samedis et veilles de jours fériés." },
    { q: "Après l'obtention (hors diplômes professionnels) de votre premier permis de conduire du groupe lourd, devez-vous obligatoirement suivre la FIMO pour le transport de biens dans des buts privés ?", a: "Non", e: "Le transport non commercial de biens à des fins privées fait partie des exceptions à l'obligation de qualification FIMO ou FCO." },
    { q: "Après 4 h 30 de conduite continue, quelle est la durée minimale de la pause que vous devez respecter ?", a: "45 mn", e: "Après 4h30 de conduite continue, vous devez respecter une pause d'au moins 45 minutes." },
    { q: "Vous venez d'obtenir votre permis C, pouvez-vous conduire un véhicule équipé d'un chronotachygraphe numérique avant d'avoir reçu votre carte conducteur ?", a: "Non", e: "Vous ne pouvez pas conduire un véhicule équipé d'un chronotachygraphe numérique, dans le cadre d'un transport professionnel, sans avoir reçu votre carte conducteur valide." },
    { q: "Vous effectuez un transport sous convention T.I.R. Les portes du véhicule doivent-elles être scellées ?", a: "Oui", e: "Dans le cadre d'un transport sous convention TIR, les portes du véhicule doivent être fermées et scellées par un scellement douanier, afin de garantir l'intégrité du chargement." },
    { q: "Vous transportez du béton liquide. Votre camion (isolé) comporte 4 essieux. Lors de la pesée avant de partir, le ticket annonce 32,8 t. Avez-vous le droit de prendre la route ?", a: "Non", e: "Pour un véhicule isolé à 4 essieux, le PTAC maximal autorisé est de 32 tonnes." },
    { q: "Vous conduisez un camion de plus de 7,5 t de PTAC. En règle générale, quand débute l'interdiction de circulation en fin de semaine ?", a: "Samedi à 22 h", e: "L'interdiction générale de circulation des poids lourds de plus de 7,5 tonnes en fin de semaine débute le samedi à 22 heures et se termine le dimanche à 22 heures." },
    { q: "Sur cette chaussée la hauteur des arbres est susceptible d'être inférieure à 4,30 m. Vrai ou faux ?", a: "Vrai", e: "Le panneau « arbres inclinés » signale que des branches peuvent surplomber la chaussée et que la hauteur disponible peut être inférieure à 4,30 mètres : restez vigilant à hauteur de ce panneau.", img: "data:image/webp;base64,UklGRoQeAABXRUJQVlA4IHgeAAAQbQCdASrwAPAAPlEijkUjoiEU2n3sOAUEpulv+8yEynIguGeof0HcvWr6N/Pv12/rf7R/OjVP5t96v3h/1fxg8u5EXpZ67/eP6d+0n9s/////7wHmAfwL+Hf5jqU+YD/X/8j1w/Qh6AH6wf/nsAP/n6gHm0f6L/i/8b9////9m/7P/9r/J/v////sM/X3/+/8n3APQA/9XV39T/7d2cf2n+wftz6C/ifzD9f/pH7E/t5/nvgK/j/D35P/B/5f0L/iv1o/Gf2f9p/8F+wf35/fP8Z4P/JT++9QL8g/kX+g/K/+//uFxm2s+YF30/1H5pec7/D/lj7hfmf+H/2nuAfyH+c/7P+5fvV77/87waPr/+5/YT4A/6R/b/83/lPyl+l3+M/5/+N/1f7M+038//wH/U/wX+S+Qr+X/1j/k/3T/Q/+//Nf//6oP/p7X/2u//XuWfrF//0BhO4AdV38cPyhFWLJvXW5yhyrgYxJXLpLNqDjjAoeBbmBQQzYGMGMbEeXSV2dtnJR+3EygF3ITQQXB49IQMSmG45jYjy6RQRgnNiMdLxNroNZqy32bokOrf15mFdP82eCD/8QyTfhjgZIl8nfqdjkmy3gXPRxs9TueMfQcCCN08D041OP9WCwPHUWwhMgGMK1s5RVM5v+qZhHg5LVIdJZtktuKcaIBowHQ9MsarqwixVHd/6JyPJ+Ll4oMMsWd0+krcq9ghWC/nKJn+9iwqatQi/7ibqNoNhj1hsruIOMtVClFI5h5XlkLJpq9TguWoDB6uQI3Gpex5VWXb5TjsY/bEuwYR7dbNAtmN8OU3fUghVEd9mwVo87UpAmqFDnxxyKo6gBM+I24AQlfmW3jehWNHpiKa99txf59aje+903w1ly01P+XRGIJjyPoHeeAFSW/id6GZDgBrvphgc3KQH+/5Te2+1q20AlYF6x1PKyoTEE5sSO6a3CmBlOEBAZL6mB9j0mYwrOEhUPWzMdUIqq0l1iPlsA/Az8vj9M6Bkq3LILdJRTlXixF0fM7lsJbW11AzQZtWBZX6IDOY8DR4yac6lxJXpJn7sCa8976OQj/DusY2tQluhUMLUNuhnwiVmirnK9MufGQd/oWCvYyy58W1lwji9rDuHzQD+8vPsP14gGPL61/f/woU0Iq/vvvvvvvvvvvg27lC82AAD+/bEAMqSTmfD59eFxq6UfPLNGIQvTDCT86/HZWBr3FT1rIPfl15rcuoKlOlT7yca7ZC5oMXYCnrNkl0AckFX7+ZQBnWXgtcpfQ4j/xi/PoclLB6DZUnWcsfDO/7L+jL0nycX+RiSPCQLUoWbcqrDmOz7iVkhJq+fO5WG+UzF2kIixxu4Mvi7r1wiT6tkgQCsYKFbyKFhNnStyDI32P6dHvnz6UVCpPcMNYMNk+T8CSwMlVxM0Fvysof3UrkJrBll1jDm5cXelV43dJZa+BG7OGCC9qouEP5IXIJDWceJZ7M53lkN7diyFKVzvQC4puvd75psEAABY9f58//8NLXNjgvtCcjCuBiTLd3doj4SOmymcnpN82QNsKdi2HIkMYedCIjIZODp2tUn5RHU8wlJQqHrA2vEkn9saJivmXKS7f4dgMj1lh52WTq/sQvkc const QUIZ_TOTAL_Q = QUIZ_FICHES.reduce((s, f) => s + f.items.length, 0);

function QuizModule({ onBack }) {
  const [view, setView] = useState("home"); // "home" | "fiche"
  const [ficheIdx, setFicheIdx] = useState(0);
  const [revealed, setRevealed] = useState({}); // key "n-i" -> true
  const [marks, setMarks] = useState({}); // key "n-i" -> "ok" | "ko"

  function openFiche(idx) {
    setFicheIdx(idx);
    setView("fiche");
  }

  function toggleReveal(key) {
    setRevealed((r) => ({ ...r, [key]: !r[key] }));
  }

  function mark(key, value) {
    setMarks((m) => ({ ...m, [key]: m[key] === value ? undefined : value }));
  }

  function ficheStats(f) {
    let ok = 0, ko = 0, seen = 0;
    f.items.forEach((_, i) => {
      const k = `${f.n}-${i}`;
      if (revealed[k]) seen++;
      if (marks[k] === "ok") ok++;
      if (marks[k] === "ko") ko++;
    });
    return { ok, ko, seen };
  }

  const globalRevealed = Object.values(revealed).filter(Boolean).length;
  const globalOk = Object.values(marks).filter((m) => m === "ok").length;

  return (
    <div style={quizStyles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; }
        button { font-family: inherit; }
        .qcard { transition: box-shadow .15s ease; }
        .reveal-btn { transition: transform .1s ease, background-color .15s ease; }
        .reveal-btn:hover { transform: translateY(-1px); }
        .fiche-tile { transition: transform .12s ease, border-color .15s ease; }
        .fiche-tile:hover { transform: translateY(-2px); }
        .mark-btn { transition: transform .1s ease, opacity .15s ease; }
        .mark-btn:hover { transform: scale(1.06); }
        .fade-in { animation: fadein .2s ease; }
        @keyframes fadein { from { opacity:0; transform: translateY(3px);} to {opacity:1; transform:translateY(0);} }
        @media (prefers-reduced-motion: reduce) {
          .qcard, .reveal-btn, .fiche-tile, .mark-btn { transition: none; }
          .fade-in { animation: none; }
        }
        button:focus-visible { outline: 3px solid #E8A33D; outline-offset: 2px; }
      `}</style>

      <header style={quizStyles.header}>
        <div style={quizStyles.headerInner}>
          <button onClick={onBack} style={quizStyles.backToMenuBtn}>← Menu principal</button>
          <div style={quizStyles.brand}>
            <Truck size={26} color="#E8A33D" strokeWidth={2.2} />
            <span style={quizStyles.brandText}>PERMIS&nbsp;C</span>
          </div>
          <div style={quizStyles.headerSub}>20 fiches — 200 questions, réponses et explications</div>
        </div>
      </header>

      <main style={quizStyles.main}>
        {view === "home" && (
          <>
            <div style={quizStyles.globalBar}>
              <LayoutGrid size={15} color="#E8A33D" />
              <span>{globalRevealed} / {QUIZ_TOTAL_Q} révélées</span>
              <span style={{ marginLeft: "auto", color: "#3F9142", fontWeight: 700 }}>{globalOk} bonnes</span>
            </div>
            <div style={quizStyles.grid}>
              {QUIZ_FICHES.map((f, idx) => {
                const { ok, ko, seen } = ficheStats(f);
                return (
                  <button key={f.n} className="fiche-tile" style={quizStyles.ficheTile} onClick={() => openFiche(idx)}>
                    <div style={quizStyles.ficheTileNum}>Fiche {f.n}</div>
                    <div style={quizStyles.ficheTileSub}>{seen}/10 vues</div>
                    {seen > 0 && (
                      <div style={quizStyles.ficheTileScore}>
                        <span style={{ color: "#3F9142" }}>{ok}✓</span>
                        <span style={{ color: "#C1443C", marginLeft: 8 }}>{ko}✗</span>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
          </>
        )}

        {view === "fiche" && (
          <QuizFicheView
            fiche={QUIZ_FICHES[ficheIdx]}
            ficheIdx={ficheIdx}
            total={QUIZ_FICHES.length}
            revealed={revealed}
            marks={marks}
            onToggleReveal={toggleReveal}
            onMark={mark}
            onBack={() => setView("home")}
            onPrev={() => setFicheIdx((i) => Math.max(0, i - 1))}
            onNext={() => setFicheIdx((i) => Math.min(QUIZ_FICHES.length - 1, i + 1))}
          />
        )}
      </main>

      <footer style={quizStyles.footer}>Fiches officielles catégorie C — 20 fiches de 10 questions, réponses conformes.</footer>
    </div>
  );
}

function QuizFicheView({ fiche, ficheIdx, total, revealed, marks, onToggleReveal, onMark, onBack, onPrev, onNext }) {
  return (
    <div className="fade-in">
      <div style={quizStyles.ficheNav}>
        <button style={quizStyles.backToMenuBtn} onClick={onBack}>← Toutes les fiches</button>
        <div style={quizStyles.navArrows}>
          <button style={quizStyles.navArrowBtn} onClick={onPrev} disabled={ficheIdx === 0}>
            <ChevronLeft size={18} />
          </button>
          <span style={quizStyles.navLabel}>Fiche {fiche.n} / {total}</span>
          <button style={quizStyles.navArrowBtn} onClick={onNext} disabled={ficheIdx === total - 1}>
            <ChevronRight size={18} />
          </button>
        </div>
      </div>

      <div style={quizStyles.qList}>
        {fiche.items.map((item, i) => {
          const key = `${fiche.n}-${i}`;
          const isRevealed = !!revealed[key];
          const mark = marks[key];
          return (
            <div key={i} className="qcard" style={quizStyles.qCard}>
              <div style={quizStyles.qRow}>
                <div style={quizStyles.qNum}>{i + 1}</div>
                <div style={quizStyles.qText}>{item.q}</div>
                {item.img && <img src={item.img} alt="Panneau de signalisation" style={quizStyles.qImg} />}
              </div>

              {!isRevealed ? (
                <button className="reveal-btn" style={quizStyles.revealBtn} onClick={() => onToggleReveal(key)}>
                  <Eye size={16} strokeWidth={2.3} />
                  Voir la réponse
                </button>
              ) : (
                <div className="fade-in" style={quizStyles.answerBlock}>
                  <div style={quizStyles.answerRow}>
                    <span style={quizStyles.answerLabel}>Réponse</span>
                    <span style={quizStyles.answerText}>{item.a}</span>
                  </div>
                  {item.e && <div style={quizStyles.expText}>{item.e}</div>}
                  <div style={quizStyles.markRow}>
                    <button
                      className="mark-btn"
                      onClick={() => onMark(key, "ok")}
                      style={{ ...quizStyles.markBtn, ...(mark === "ok" ? quizStyles.markBtnOkActive : {}) }}
                    >
                      <Check size={14} strokeWidth={3} /> J'avais juste
                    </button>
                    <button
                      className="mark-btn"
                      onClick={() => onMark(key, "ko")}
                      style={{ ...quizStyles.markBtn, ...(mark === "ko" ? quizStyles.markBtnKoActive : {}) }}
                    >
                      <X size={14} strokeWidth={3} /> J'avais faux
                    </button>
                    <button style={quizStyles.hideBtn} onClick={() => onToggleReveal(key)}>Masquer</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={quizStyles.bottomNav}>
        <button style={quizStyles.navBtn} onClick={onPrev} disabled={ficheIdx === 0}>← Fiche précédente</button>
        <button style={quizStyles.navBtn} onClick={onNext} disabled={ficheIdx === total - 1}>Fiche suivante →</button>
      </div>
    </div>
  );
}

    <div style={oralStyles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; }
        button { font-family: inherit; }
        .fiche-tile { transition: transform .12s ease; }
        .fiche-tile:hover { transform: translateY(-2px); }
        .nav-btn { transition: transform .1s ease, opacity .15s ease; }
        .nav-btn:hover:not(:disabled) { transform: translateY(-1px); }
        .nav-btn:disabled { opacity: .35; cursor: default; }
        .fade-in { animation: fadein .2s ease; }
        @keyframes fadein { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:translateY(0);} }
        @media (prefers-reduced-motion: reduce) {
          .fiche-tile, .nav-btn { transition: none; }
          .fade-in { animation: none; }
        }
        button:focus-visible { outline: 3px solid #E8A33D; outline-offset: 2px; }
      `}</style>

      <header style={oralStyles.header}>
        <div style={oralStyles.headerInner}>
          <button onClick={view === "home" ? onBack : () => setView("home")} style={oralStyles.backToMenuBtn}>
            ← {view === "home" ? "Menu principal" : "Toutes les fiches"}
          </button>
          <div style={oralStyles.brand}>
            <Truck size={26} color="#E8A33D" strokeWidth={2.2} />
            <span style={oralStyles.brandText}>SAMAD&nbsp;PERMIS&nbsp;C</span>
          </div>
          <div style={oralStyles.headerSub}>Fiches orales de sécurité de l'inspecteur</div>
        </div>
      </header>

      <main style={oralStyles.main}>
        {view === "home" ? (
          <>
            <p style={{ fontSize: 13, color: "#9BA1A8", margin: "0 0 14px" }}>
              {seenCount} / 12 fiches consultées — le recto officiel tel que remis par l'inspecteur le jour de l'examen.
            </p>
            <div style={oralStyles.grid}>
              {INSPECTOR_FICHES.map((f, i) => (
                <button key={f.n} className="fiche-tile" style={oralStyles.ficheTile} onClick={() => open(i)}>
                  <div style={oralStyles.ficheTileNum}>{f.n}</div>
                  <div style={oralStyles.ficheTileTitle}>{f.title.replace("\n", " — ")}</div>
                  {seen[i] && <div style={oralStyles.seenBadge}>✓ vue</div>}
                </button>
              ))}
            </div>
          </>
        ) : (
          <div className="fade-in">
            <div style={inspectorStyles.card}>
              <img src={fiche.img} alt={`Fiche ${fiche.n} — ${fiche.title}`} style={inspectorStyles.pageImg} />
            </div>

            <div style={oralStyles.bottomNav}>
              <button
                className="nav-btn"
                style={oralStyles.navBtn}
                disabled={idx === 0}
                onClick={() => open(idx - 1)}
              >
                <ChevronLeft size={16} /> Précédente
              </button>
              <button
                className="nav-btn"
                style={oralStyles.navBtn}
                disabled={idx === INSPECTOR_FICHES.length - 1}
                onClick={() => open(idx + 1)}
              >
                Suivante <ChevronRight size={16} />
              </button>
            </div>
          </div>
        )}
      </main>

      <footer style={oralStyles.footer}>
        Fiches orales de sécurité — recto officiel remis par l'inspecteur le jour de l'examen (catégorie C).
      </footer>
    </div>
  );
}
